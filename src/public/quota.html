<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f8f6f3;
      --paper-2: #fff;
      --ink: #1a1814;
      --ink-2: #4a4640;
      --ink-3: #8a847c;
      --line: #e8e4de;
      --accent: #c45c26;
      --accent-bg: rgba(196, 92, 38, 0.08);
      --blue: #2563eb;
      --blue-bg: rgba(37, 99, 235, 0.08);
      --danger: #b91c1c;
      --danger-bg: rgba(185, 28, 28, 0.06);
      --ok: #15803d;
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Figtree", system-ui, sans-serif;
      --mono: "JetBrains Mono", monospace;
      --shadow: 0 1px 2px rgba(26, 24, 20, 0.04), 0 12px 40px rgba(26, 24, 20, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
    h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; }
    .lead { color: var(--ink-3); font-size: 0.875rem; margin: 0 0 1.75rem; max-width: 62ch; }
    .spacer { flex: 1; }
    a { color: var(--blue); }
    .btn {
      font: inherit;
      font-size: 0.8125rem;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: var(--ink-2);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--ink-3); color: var(--ink); }
    .muted { color: var(--ink-3); font-size: 0.8125rem; }

    section { margin-bottom: 2.25rem; }
    .sec-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.85rem; }
    .sec-head h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); margin: 0; font-weight: 600; }
    .sec-head .count { font-size: 0.75rem; color: var(--ink-3); font-family: var(--mono); }

    .card {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .row { padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .row-top { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.45rem; }
    .win { font-weight: 600; font-size: 0.9375rem; }
    .seat { font-size: 0.75rem; color: var(--ink-3); }
    .seat code { font-family: var(--mono); font-size: 0.9em; }
    .figure { margin-left: auto; font-family: var(--mono); font-size: 0.8125rem; white-space: nowrap; }
    .bar-row { display: flex; align-items: center; gap: 0.7rem; }
    .track { flex: 1; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .fill { height: 100%; border-radius: 4px; background: var(--ok); transition: width 0.25s ease; }
    /* Colour is the fast read; the number is the detail. */
    .fill.warn { background: var(--accent); }
    .fill.crit { background: var(--danger); }
    .spark { width: 62px; height: 16px; flex: none; opacity: 0.7; }
    .spark path { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linejoin: round; }
    .reset { font-size: 0.75rem; color: var(--ink-3); margin-top: 0.3rem; }

    .note {
      padding: 0.9rem 1.1rem;
      font-size: 0.8125rem;
      color: var(--ink-3);
    }
    .note.bad { color: var(--danger); background: var(--danger-bg); }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--blue-bg);
      color: var(--blue);
    }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-3); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Quota</h1>
      <span class="spacer"></span>
      <span id="stamp" class="muted"></span>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <a class="btn" href="/admin/dashboard" style="text-decoration:none">Dashboard</a>
    </header>
    <p class="lead">
      What each connected subscription has left at its vendor, grouped by how long the window runs.
      This is the seat's own quota — not what this gateway has spent.
    </p>
    <div id="content"><p class="muted">Loading…</p></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[ch]);
    }

    async function api(path) {
      const r = await fetch('/admin' + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(data.message || data.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    /**
     * Which section a window belongs in, from the period the vendor stated.
     *
     * Grouping is by duration rather than by the vendor's own naming, because
     * the names disagree — Codex calls its long window "secondary", Claude
     * calls the same length "seven day". The period is the one thing they agree
     * on. Every row still prints its own window length, so the grouping is a
     * convenience and never the only way to tell what a row means.
     */
    const SECTIONS = [
      { id: 'session', title: 'Session', hint: 'Short rolling windows that refill through the day' },
      { id: 'weekly', title: 'Weekly', hint: 'Windows of about a week' },
      { id: 'monthly', title: 'Monthly', hint: 'Billing-cycle and monthly caps' },
      { id: 'other', title: 'Other', hint: 'Windows the vendor reported without a period' },
    ];

    function sectionOf(periodHours) {
      if (periodHours == null) return 'other';
      if (periodHours < 24) return 'session';
      if (periodHours <= 24 * 10) return 'weekly';
      return 'monthly';
    }

    function periodLabel(hours) {
      if (hours == null) return '';
      if (hours < 24) return Math.round(hours) + 'h window';
      const days = Math.round(hours / 24);
      if (days === 7) return 'weekly window';
      if (days >= 28 && days <= 31) return 'monthly window';
      return days + 'd window';
    }

    function untilLabel(ms) {
      if (!ms) return '';
      const delta = ms - Date.now();
      if (delta <= 0) return 'resets now';
      const mins = Math.round(delta / 60000);
      if (mins < 60) return 'resets in ' + mins + 'm';
      const hrs = Math.floor(mins / 60);
      if (hrs < 48) {
        const rem = mins % 60;
        return 'resets in ' + hrs + 'h' + (rem ? ' ' + rem + 'm' : '');
      }
      return 'resets in ' + Math.round(hrs / 24) + 'd';
    }

    function tone(pct) {
      if (pct >= 90) return ' crit';
      if (pct >= 75) return ' warn';
      return '';
    }

    /**
     * Recorded history for one window, on a fixed 0-100 scale.
     *
     * Fitting the line to the data would make a window at 2% look like one at
     * 90%. Two points is the minimum worth drawing — one sample is not a trend.
     */
    function sparkline(points) {
      const usable = (points || []).filter((p) => typeof p.p === 'number');
      if (usable.length < 2) return '';
      const w = 62, h = 16;
      const step = w / (usable.length - 1);
      const d = usable.map((p, i) =>
        `${i ? 'L' : 'M'}${(i * step).toFixed(1)} ${(h - (Math.max(0, Math.min(100, p.p)) / 100) * h).toFixed(1)}`
      ).join(' ');
      const first = Math.round(usable[0].p);
      const last = Math.round(usable[usable.length - 1].p);
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend: ${first}% to ${last}%"><title>${usable.length} samples · ${first}% → ${last}%</title><path d="${d}"/></svg>`;
    }

    function renderRow(row) {
      const pct = typeof row.usedPercent === 'number'
        ? Math.max(0, Math.min(100, row.usedPercent))
        : null;
      const figure = pct === null ? 'not reported' : pct.toFixed(0) + '% used';
      const meta = [untilLabel(row.resetsAt), periodLabel(row.periodHours)]
        .filter(Boolean).join(' · ');
      return `<div class="row">
        <div class="row-top">
          <span class="win">${esc(row.label)}</span>
          <span class="seat">${esc(row.seatName)} · <code>${esc(row.seatId)}</code></span>
          <span class="figure">${esc(figure)}</span>
        </div>
        <div class="bar-row">
          <div class="track"><div class="fill${pct === null ? '' : tone(pct)}" style="width:${pct === null ? 0 : pct}%"></div></div>
          ${sparkline(row.history)}
        </div>
        ${meta ? `<div class="reset">${esc(meta)}</div>` : ''}
      </div>`;
    }

    function renderSections(rows, problems) {
      const parts = [];

      for (const section of SECTIONS) {
        const inSection = rows.filter((r) => sectionOf(r.periodHours) === section.id);
        if (!inSection.length) continue;
        // Fullest first: the page exists to answer "what is about to run out".
        inSection.sort((a, b) => (b.usedPercent ?? -1) - (a.usedPercent ?? -1));
        parts.push(`<section>
          <div class="sec-head">
            <h2>${esc(section.title)}</h2>
            <span class="count">${inSection.length}</span>
            <span class="muted">${esc(section.hint)}</span>
          </div>
          <div class="card">${inSection.map(renderRow).join('')}</div>
        </section>`);
      }

      if (problems.length) {
        parts.push(`<section>
          <div class="sec-head"><h2>Not reporting</h2><span class="count">${problems.length}</span></div>
          <div class="card">${problems.map((p) => `<div class="note ${p.kind === 'error' ? 'bad' : ''}">
            <strong>${esc(p.seatName)}</strong> <code style="font-family:var(--mono);font-size:0.85em">${esc(p.seatId)}</code>
            ${p.kind === 'unsupported' ? '<span class="badge">no usage endpoint</span>' : ''}
            — ${esc(p.message)}
          </div>`).join('')}</div>
        </section>`);
      }

      if (!parts.length) {
        parts.push('<div class="empty">No subscription accounts are reporting limits yet.<br>Connect one from the <a href="/admin/dashboard">dashboard</a>.</div>');
      }
      return parts.join('');
    }

    async function loadSeat(seat) {
      // History is stored locally by the hourly sampler, so it never slows the
      // live lookup down; both go out together.
      const [usage, history] = await Promise.allSettled([
        api('/oauth/' + encodeURIComponent(seat.id) + '/usage'),
        api('/oauth/' + encodeURIComponent(seat.id) + '/history'),
      ]);

      if (usage.status === 'rejected') {
        return { problem: { seatId: seat.id, seatName: seat.name, kind: 'error', message: usage.reason.message } };
      }
      const data = usage.value;
      if (data.status === 'unsupported') {
        return { problem: { seatId: seat.id, seatName: seat.name, kind: 'unsupported', message: data.message } };
      }

      const series = history.status === 'fulfilled' ? (history.value.series || {}) : {};
      const rows = (data.windows || []).map((w) => ({
        ...w,
        seatId: seat.id,
        seatName: seat.name,
        history: series[w.id],
      }));
      if (!rows.length) {
        return { problem: { seatId: seat.id, seatName: seat.name, kind: 'empty', message: 'The vendor reported no limit windows for this account.' } };
      }
      return { rows };
    }

    async function load() {
      const content = $('content');
      content.innerHTML = '<p class="muted">Reading limits from each vendor…</p>';
      $('stamp').textContent = '';

      let providers;
      try {
        ({ providers } = await api('/oauth/providers'));
      } catch (e) {
        // Told apart because they need different actions: sign in, or ask an
        // admin. Anything else is reported as itself.
        const message = e.status === 401
          ? 'Sign in first — <a href="/admin/dashboard">open the dashboard</a>, then come back.'
          : e.status === 403
            ? 'Subscription limits are visible to admins only.'
            : esc(e.message);
        content.innerHTML = `<div class="card"><div class="note bad">${message}</div></div>`;
        return;
      }

      if (!providers.length) {
        content.innerHTML = '<div class="empty">No subscription accounts connected.<br>Connect one from the <a href="/admin/dashboard">dashboard</a>.</div>';
        return;
      }

      // In parallel across seats: each is a different vendor, so they do not
      // contend with one another the way repeated calls to one vendor would.
      const results = await Promise.all(providers.map(loadSeat));
      const rows = results.flatMap((r) => r.rows || []);
      const problems = results.filter((r) => r.problem).map((r) => r.problem);

      content.innerHTML = renderSections(rows, problems);
      $('stamp').textContent = 'as of ' + new Date().toLocaleTimeString();
    }

    $('refresh').onclick = load;
    load();
  </script>
</body>
</html>
