<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Quota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!--THEME-->
</head>
<body>
  <main class="content" style="padding-top:0">
    <div class="content__inner">
      <header class="bar">
        <div class="bar__title">
          <div class="brand" style="margin-bottom:var(--s-4)">
            <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="1.5" y="1.5" width="21" height="21" rx="6" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
              <path d="M6.5 15.5 12 8l5.5 7.5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.5 15.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
            </svg>
            <span class="brand__name">Gateway<span class="brand__sub">Managed proxy</span></span>
          </div>
          <h1>Quota</h1>
          <p>What each connected subscription has left at its vendor, grouped by how long the window runs. This is the seat's own quota, not what this gateway has spent.</p>
        </div>
        <div class="bar__actions">
          <span class="muted" id="stamp"></span>
          <button type="button" class="btn btn--secondary btn--sm" id="refresh"><span class="btn__spin"></span>Re-read</button>
          <a class="btn btn--secondary btn--sm" href="/docs">Docs</a>
          <a class="btn btn--secondary btn--sm" href="/admin/dashboard">Dashboard</a>
          <button type="button" class="btn btn--quiet btn--icon" id="theme-toggle" aria-label="Switch theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div id="content"></div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    /* Theme, identical to the other pages so a choice made once holds. */
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('gw-theme'); } catch (e) { /* private mode */ }
    var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(mode) { document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light'; }
    applyTheme(savedTheme || (darkQuery.matches ? 'dark' : 'light'));
    darkQuery.addEventListener('change', function (e) { if (!savedTheme) applyTheme(e.matches ? 'dark' : 'light'); });
    document.getElementById('theme-toggle').onclick = function () {
      savedTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('gw-theme', savedTheme); } catch (e) { /* ignore */ }
      applyTheme(savedTheme);
    };

    window.addEventListener('scroll', function () {
      document.querySelector('.bar').dataset.stuck = window.scrollY > 12 ? 'true' : 'false';
    }, { passive: true });

    var $ = function (id) { return document.getElementById(id); };

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    async function api(path) {
      var r = await fetch('/admin' + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        var err = new Error(data.message || data.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    /**
     * Which section a window belongs in, from the period the vendor stated.
     *
     * Grouping is by duration rather than by the vendor's own naming, because
     * the names disagree: Codex calls its long window "secondary", Claude calls
     * the same length "seven day". The period is the one thing they agree on.
     * Every row still prints its own window length, so the grouping is a
     * convenience and never the only way to tell what a row means.
     */
    var SECTIONS = [
      { id: 'session', title: 'Session', hint: 'Short rolling windows that refill through the day' },
      { id: 'weekly', title: 'Weekly', hint: 'Windows of about a week' },
      { id: 'monthly', title: 'Monthly', hint: 'Billing-cycle and monthly caps' },
      { id: 'other', title: 'Other', hint: 'Windows the vendor reported without a period' },
    ];

    function sectionOf(periodHours) {
      if (periodHours == null) return 'other';
      if (periodHours < 24) return 'session';
      if (periodHours <= 24 * 10) return 'weekly';
      return 'monthly';
    }

    function periodLabel(hours) {
      if (hours == null) return '';
      if (hours < 24) return Math.round(hours) + 'h window';
      var days = Math.round(hours / 24);
      if (days === 7) return 'weekly window';
      if (days >= 28 && days <= 31) return 'monthly window';
      return days + 'd window';
    }

    function untilLabel(ms) {
      if (!ms) return '';
      var delta = ms - Date.now();
      if (delta <= 0) return 'resets now';
      var mins = Math.round(delta / 60000);
      if (mins < 60) return 'resets in ' + mins + 'm';
      var hrs = Math.floor(mins / 60);
      if (hrs < 48) {
        var rem = mins % 60;
        return 'resets in ' + hrs + 'h' + (rem ? ' ' + rem + 'm' : '');
      }
      return 'resets in ' + Math.round(hrs / 24) + 'd';
    }

    function tone(pct) {
      if (pct == null) return 'none';
      if (pct >= 90) return 'crit';
      if (pct >= 75) return 'warn';
      return 'ok';
    }

    function meter(pct, extra) {
      return '<div class="meter' + (extra ? ' ' + extra : '') + '">' +
        '<div class="meter__fill" data-tone="' + tone(pct) + '" data-pct="' + (pct == null ? 0 : pct) + '"' +
        ' role="progressbar" aria-valuemin="0" aria-valuemax="100"' +
        (pct == null ? ' aria-valuetext="not reported"' : ' aria-valuenow="' + Math.round(pct) + '"') +
        '></div></div>';
    }

    function paintMeters(root) {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call((root || document).querySelectorAll('.meter__fill[data-pct]'), function (el) {
          el.style.width = Math.max(0, Math.min(100, Number(el.dataset.pct))) + '%';
        });
      });
    }

    /**
     * Recorded history for one window, on a fixed 0-100 scale.
     *
     * Fitting the line to its own data would make a window at 2% look like one
     * at 90%. Two points is the minimum worth drawing: one sample is not a trend.
     */
    function sparkline(points) {
      var usable = (points || []).filter(function (p) { return typeof p.p === 'number'; });
      if (usable.length < 2) return '';
      var w = 64, h = 18;
      var step = w / (usable.length - 1);
      var d = usable.map(function (p, i) {
        var y = h - (Math.max(0, Math.min(100, p.p)) / 100) * h;
        return (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + y.toFixed(1);
      }).join(' ');
      var first = Math.round(usable[0].p);
      var last = Math.round(usable[usable.length - 1].p);
      return '<svg class="spark" style="width:4rem;height:1.1rem" viewBox="0 0 ' + w + ' ' + h +
        '" role="img" aria-label="Trend, ' + first + '% to ' + last + '%"><title>' + usable.length +
        ' samples, ' + first + '% to ' + last + '%</title><path d="' + d + '"/></svg>';
    }

    function renderRow(row) {
      var pct = typeof row.usedPercent === 'number'
        ? Math.max(0, Math.min(100, row.usedPercent))
        : null;
      var meta = [untilLabel(row.resetsAt), periodLabel(row.periodHours)].filter(Boolean).join(' · ');
      return '<div class="record">' +
        '<div class="record__top"><div>' +
          '<div class="record__name">' + esc(row.label) + '</div>' +
          '<div class="record__meta">' + esc(row.seatName) +
            '<span class="dot">&middot;</span><code class="id">' + esc(row.seatId) + '</code>' +
            (meta ? '<span class="dot">&middot;</span><span>' + esc(meta) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="record__actions mono">' +
          (pct === null ? '<span class="muted">not reported</span>' : pct.toFixed(0) + '% used') +
        '</div></div>' +
        '<div class="gauge__bar">' + meter(pct, 'meter--lg') + sparkline(row.history) + '</div>' +
      '</div>';
    }

    /**
     * The one window closest to running out.
     *
     * It is the question the page exists to answer, and reading it off a list of
     * twelve meters is work the page can do instead.
     */
    function renderHeadline(rows) {
      var measured = rows.filter(function (r) { return typeof r.usedPercent === 'number'; });
      if (!measured.length) return '';
      var worst = measured.slice().sort(function (a, b) { return b.usedPercent - a.usedPercent; })[0];
      var pct = Math.max(0, Math.min(100, worst.usedPercent));
      var verdict = pct >= 90 ? 'Nearly spent.' : pct >= 75 ? 'Running low.' : 'Plenty left.';
      var reset = untilLabel(worst.resetsAt);
      return '<div class="section"><div class="panel"><div class="panel__body stack">' +
        '<div class="figures">' +
          '<div><span class="figure__value" style="color:var(--' +
            (pct >= 90 ? 'danger' : pct >= 75 ? 'warn' : 'ok') + ')">' + pct.toFixed(0) + '%</span>' +
            '<span class="figure__label">Tightest window</span></div>' +
          '<div class="figure--sub"><span class="figure__value">' + esc(worst.label) + '</span>' +
            '<span class="figure__label">' + esc(worst.seatName) + '</span></div>' +
          (reset ? '<div class="figure--sub"><span class="figure__value">' + esc(reset.replace('resets in ', '')) +
            '</span><span class="figure__label">Until reset</span></div>' : '') +
        '</div>' +
        '<p class="muted">' + verdict + ' Nothing else you have connected is closer to its ceiling than this.</p>' +
        '</div></div></div>';
    }

    function renderSections(rows, problems) {
      var parts = [renderHeadline(rows)];

      SECTIONS.forEach(function (section) {
        var inSection = rows.filter(function (r) { return sectionOf(r.periodHours) === section.id; });
        if (!inSection.length) return;
        // Fullest first: the page exists to answer "what is about to run out".
        inSection.sort(function (a, b) {
          return (b.usedPercent == null ? -1 : b.usedPercent) - (a.usedPercent == null ? -1 : a.usedPercent);
        });
        parts.push('<div class="section">' +
          '<div class="section__head"><h2>' + esc(section.title) + '</h2>' +
          '<span class="count">' + inSection.length + '</span>' +
          '<p>' + esc(section.hint) + '</p></div>' +
          '<div class="records">' + inSection.map(renderRow).join('') + '</div></div>');
      });

      if (problems.length) {
        parts.push('<div class="section">' +
          '<div class="section__head"><h2>Not reporting</h2>' +
          '<span class="count">' + problems.length + '</span>' +
          '<p>Connected seats that returned no usable figures. A vendor with no usage endpoint is working as intended; an error is not.</p></div>' +
          '<div class="records">' + problems.map(function (p) {
            return '<div class="record"><div class="record__top"><div>' +
              '<div class="record__name">' + esc(p.seatName) +
                (p.kind === 'unsupported' ? ' <span class="badge">no usage endpoint</span>' : '') +
                (p.kind === 'empty' ? ' <span class="badge">no windows reported</span>' : '') +
                (p.kind === 'error' ? ' <span class="badge badge--danger">error</span>' : '') +
              '</div>' +
              '<div class="record__meta"><code class="id">' + esc(p.seatId) + '</code></div>' +
              '</div></div>' +
              '<p class="muted">' + esc(p.message) + '</p></div>';
          }).join('') + '</div></div>');
      }

      if (parts.join('') === '') {
        return '<div class="section"><div class="records">' + [
          '<div class="empty"><strong>Nothing is reporting limits yet</strong>',
          '<p>Connect a subscription account from the <a href="/admin/dashboard">dashboard</a>, and its vendor windows appear here within the hour.</p></div>',
        ].join('') + '</div></div>';
      }
      return parts.join('');
    }

    function skeleton() {
      var rows = '';
      for (var i = 0; i < 3; i++) {
        rows += '<div class="record"><div class="record__top"><div>' +
          '<div class="record__name"><span class="skeleton">reading limits</span></div>' +
          '<div class="record__meta"><span class="skeleton">from the vendor</span></div>' +
          '</div></div><div class="meter meter--lg"></div></div>';
      }
      return '<div class="section"><div class="records">' + rows + '</div></div>';
    }

    async function loadSeat(seat) {
      // History is stored locally by the hourly sampler, so it never slows the
      // live lookup down. Both go out together.
      var results = await Promise.allSettled([
        api('/oauth/' + encodeURIComponent(seat.id) + '/usage'),
        api('/oauth/' + encodeURIComponent(seat.id) + '/history'),
      ]);
      var usage = results[0];
      var history = results[1];

      if (usage.status === 'rejected') {
        return { problem: { seatId: seat.id, seatName: seat.name, kind: 'error', message: usage.reason.message } };
      }
      var data = usage.value;
      if (data.status === 'unsupported') {
        return { problem: { seatId: seat.id, seatName: seat.name, kind: 'unsupported', message: data.message } };
      }

      var series = history.status === 'fulfilled' ? (history.value.series || {}) : {};
      var rows = (data.windows || []).map(function (w) {
        return Object.assign({}, w, { seatId: seat.id, seatName: seat.name, history: series[w.id] });
      });
      if (!rows.length) {
        return { problem: {
          seatId: seat.id, seatName: seat.name, kind: 'empty',
          message: 'The vendor reported no limit windows for this account.',
        } };
      }
      return { rows: rows };
    }

    async function load() {
      var content = $('content');
      var btn = $('refresh');
      btn.dataset.busy = 'true';
      content.innerHTML = skeleton();
      $('stamp').textContent = '';

      var providers;
      try {
        providers = (await api('/oauth/providers')).providers || [];
      } catch (e) {
        // Told apart because they need different actions: sign in, or ask an
        // admin. Anything else is reported as itself.
        var message = e.status === 401
          ? 'Sign in first. <a href="/admin/dashboard">Open the dashboard</a>, then come back.'
          : e.status === 403
            ? 'Subscription limits are visible to admins only.'
            : esc(e.message);
        content.innerHTML = '<div class="section"><div class="note note--bad">' + message + '</div></div>';
        btn.dataset.busy = 'false';
        return;
      }

      if (!providers.length) {
        content.innerHTML = '<div class="section"><div class="records"><div class="empty">' +
          '<strong>No subscription accounts connected</strong>' +
          '<p>Connect a ChatGPT, Claude, Grok, Antigravity or Kimi seat from the ' +
          '<a href="/admin/dashboard">dashboard</a> to see what it has left.</p></div></div></div>';
        btn.dataset.busy = 'false';
        return;
      }

      // In parallel across seats: each is a different vendor, so they do not
      // contend with one another the way repeated calls to one vendor would.
      var results = await Promise.all(providers.map(loadSeat));
      var rows = results.reduce(function (acc, r) { return acc.concat(r.rows || []); }, []);
      var problems = results.filter(function (r) { return r.problem; }).map(function (r) { return r.problem; });

      content.innerHTML = renderSections(rows, problems);
      paintMeters(content);
      $('stamp').textContent = 'read at ' + new Date().toLocaleTimeString();
      btn.dataset.busy = 'false';
    }

    $('refresh').onclick = load;
    load();
  })();
  </script>
</body>
</html>
