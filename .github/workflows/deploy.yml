name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ai-gateway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Both steps target the top-level environment, which is where the D1
      # binding and vars live — `[env.staging]` and `[env.production]` redefine
      # neither, and Wrangler does not inherit bindings into named environments.
      #
      # Passing `--env=""` to mean "top-level" does not work: Wrangler looks for
      # an environment literally named "" and exits with "No environment found
      # in configuration with name ''", which is why this workflow has never got
      # past its first step. Omitting the flag is what selects top-level.
      #
      # D1 runs on wrangler 4 because the pinned wrangler 3 fails D1 API calls
      # against this account with code 7403. It must succeed: the proxy reads
      # columns added in migration 0005 on every request, so a deploy that
      # outran its migrations would break all /v1 traffic.
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply ai-gateway-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx wrangler deploy --minify src/index.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
